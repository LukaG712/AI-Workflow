[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "junie-adapter"
version = "1.0.0"
description = "JunieHub — coding-agent orchestration backend for AgentHub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[project.scripts]
junie-orchestrator = "junie_adapter.service:app"

[tool.setuptools.packages.find]
include = ["junie_adapter*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Broad Exception catches are intentional in an orchestration system where
# we need to catch any failure from external subprocesses and services.
# Try-except-pass is used intentionally for non-critical cleanup paths.
# Subprocess.run in async tests is acceptable for short git init commands.
# PLW1510: subprocess.run without check is fine for test setup where we don't need to fail on error.
ignore = ["BLE001", "S110", "ASYNC221", "PLW1510"]
